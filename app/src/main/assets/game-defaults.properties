# Gameplay defaults bundled with the APK. Change values and rebuild the app.
# Hold time before the arrow exit preview appears (100..5000 ms).
arrowPreviewHoldMillis=400

# Initial settings shown in the settings menu.
# Allowed values: hearts 3, 5, 10; hints 0, 1, 3, 5.
defaultLives=5
defaultHints=3

# Allow starting a new arrow before the previous arrow has finished moving.
defaultConcurrentArrows=true

# 0 = Ruhig, 1 = Normal, 2 = Flott, 3 = Turbo.
defaultAnimationSpeed=1

# Debug builds: optional hamburger-menu entry for selecting a stage.
showStageAdjustment=true

# Maximum cooperative time (ms) spent TRYING Exact Cover per missing cache slot.
# 0 skips Exact Cover during preparation and fills with validated Legacy levels.
# It is a cooperative budget: a single in-flight generator invocation cannot be interrupted.
preparationExactBudgetMillis=30000
# Maximum Exact Cover candidates tried for each cache slot before fallback.
preparationExactAttemptsPerSlot=8
