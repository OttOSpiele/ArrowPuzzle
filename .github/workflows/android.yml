name: Android Debug APK

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping develop builds from racing on the rolling release tag.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Test Kotlin game core
        run: gradle --no-daemon --warning-mode all :game-core:test

      - name: Build debug APK
        run: gradle --no-daemon --warning-mode all :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: OttOSpiele-ArrowPuzzle-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: game-core-test-reports
          path: game-core/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish rolling development APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk OttOSpiele-ArrowPuzzle-debug.apk
          if gh release view develop-preview >/dev/null 2>&1; then
            git tag -f develop-preview "$GITHUB_SHA"
            git push --force origin refs/tags/develop-preview
            gh release upload develop-preview OttOSpiele-ArrowPuzzle-debug.apk --clobber
            gh release edit develop-preview --title "Arrow Puzzle – Entwicklungs-APK" --notes "Automatischer Debug-Build von develop. Commit: ${GITHUB_SHA}. Nur für interne Tests; kein signiertes Play-Store-Release." --prerelease
          else
            gh release create develop-preview OttOSpiele-ArrowPuzzle-debug.apk --target "$GITHUB_SHA" --title "Arrow Puzzle – Entwicklungs-APK" --notes "Automatischer Debug-Build von develop. Commit: ${GITHUB_SHA}. Nur für interne Tests; kein signiertes Play-Store-Release." --prerelease
          fi

      - name: Benchmark generator reference levels
        if: success()
        id: generator_benchmark
        continue-on-error: true
        run: gradle --no-daemon :game-core:benchmarkLevels

      - name: Benchmark independent Exact Cover
        if: success()
        continue-on-error: true
        timeout-minutes: 7
        run: timeout 360s gradle --no-daemon :game-core:benchmarkExactCover

      - name: Compare exact cover with frozen build 221
        if: success()
        continue-on-error: true
        timeout-minutes: 8
        run: timeout 450s gradle --no-daemon :game-core:benchmarkExactCoverAB

      - name: Install PDF renderer
        if: always()
        run: python3 -m pip install --disable-pip-version-check 'reportlab>=4.2,<5'

      - name: Render visual generator catalog
        if: always()
        run: |
          if [ -s game-core/build/benchmark/boards.tsv ]; then
            python3 tools/render_generator_benchmark.py game-core/build/benchmark
          else
            echo "No benchmark geometry output available."
          fi
          if [ -s game-core/build/benchmark/exact-cover-boards.tsv ]; then
            python3 tools/render_generator_benchmark.py game-core/build/benchmark exact-cover-boards.tsv exact-cover-levels.pdf
          fi

      - name: Upload generator benchmark (CSV + PDF)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arrow-generator-benchmark
          path: game-core/build/benchmark/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-problems-report
          path: |
            build/reports/problems/
            app/build/reports/problems/
            game-core/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 7

  exact-cover-stage-series:
    name: Exact Cover stages 9–80 and PDF catalog
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Run stage 9–80 Exact Cover benchmark
        run: gradle --no-daemon --warning-mode all :game-core:benchmarkExactCoverStages -PexactStageSeeds=16
      - name: Install PDF renderer
        if: always()
        run: python3 -m pip install --disable-pip-version-check 'reportlab>=4.2,<5'
      - name: Render eight-board-per-stage Exact Cover catalog
        if: always()
        run: |
          if [ -s game-core/build/benchmark/exact-cover-stage-catalog.tsv ]; then
            python3 tools/render_generator_benchmark.py game-core/build/benchmark exact-cover-stage-catalog.tsv exact-cover-stage-catalog.pdf
          fi
      - name: Upload full Exact Cover stage benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exact-cover-stages-9-80
          path: |
            game-core/build/benchmark/exact-cover-stages.csv
            game-core/build/benchmark/exact-cover-stages-summary.csv
            game-core/build/benchmark/exact-cover-stages-summary.txt
            game-core/build/benchmark/exact-cover-stage-catalog.tsv
            game-core/build/benchmark/exact-cover-stage-catalog.pdf
          if-no-files-found: warn
          retention-days: 30
