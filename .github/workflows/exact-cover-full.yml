name: Exact Cover Full Generator Verification

on:
  push:
    branches: [develop]
    paths:
      - 'game-core/src/main/kotlin/de/ottospiele/arrow/ExactCoverGenerator.kt'
      - 'game-core/src/main/kotlin/de/ottospiele/arrow/LevelGeneration.kt'
      - 'game-core/src/main/kotlin/de/ottospiele/arrow/DifficultyProfiles.kt'
      - 'game-core/src/main/kotlin/de/ottospiele/arrow/Core.kt'
      - 'game-core/src/test/kotlin/de/ottospiele/arrow/ExactCoverStageBenchmark.kt'
      - 'game-core/build.gradle.kts'
      - 'tools/render_generator_benchmark.py'
      - '.github/workflows/exact-cover-full.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'game-core/src/main/kotlin/de/ottospiele/arrow/ExactCoverGenerator.kt'
      - 'game-core/src/main/kotlin/de/ottospiele/arrow/LevelGeneration.kt'
      - 'game-core/src/main/kotlin/de/ottospiele/arrow/DifficultyProfiles.kt'
      - 'game-core/src/main/kotlin/de/ottospiele/arrow/Core.kt'
      - 'game-core/src/test/kotlin/de/ottospiele/arrow/ExactCoverStageBenchmark.kt'
      - 'game-core/build.gradle.kts'
      - 'tools/render_generator_benchmark.py'
      - '.github/workflows/exact-cover-full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stages:
    name: Exact Cover stages 9–80 and PDF catalog
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Run all-stage Exact Cover benchmark
        run: gradle --no-daemon --warning-mode all :game-core:benchmarkExactCoverStages -PexactStageSeeds=16
      - name: Install PDF renderer
        if: always()
        run: python3 -m pip install --disable-pip-version-check 'reportlab>=4.2,<5'
      - name: Render full reference PDF
        if: always()
        run: |
          if [ -s game-core/build/benchmark/exact-cover-stages-boards.tsv ]; then
            python3 tools/render_generator_benchmark.py game-core/build/benchmark exact-cover-stages-boards.tsv exact-cover-stages.pdf
          fi
      - name: Upload complete benchmark data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exact-cover-stages-9-80
          path: |
            game-core/build/benchmark/exact-cover-stages*
          if-no-files-found: warn
          retention-days: 30
