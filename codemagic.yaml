workflows:
  android-debug:
    name: OttOSpiele Arrow Puzzle - Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true
    scripts:
      - name: Prepare pinned Gradle 8.11.1
        script: |
          set -eu
          curl --fail --location --retry 3 --output /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.11.1/bin/gradle --version
      - name: Run game-core tests
        script: |
          set -eu
          /tmp/gradle-8.11.1/bin/gradle --no-daemon :game-core:test
      - name: Build Android debug APK
        script: |
          set -eu
          /tmp/gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
